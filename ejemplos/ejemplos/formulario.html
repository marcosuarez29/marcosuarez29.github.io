<!DOCTYPE html>
<html lang="es-ES">
	<head>
		<meta charset="UTF-8">
		<title>Simple</title>
		<link rel="stylesheet" href="css/style2.css">
	</head>
<body>
  <header>
    <h1>Mi super página Formulario</h1>
  </header>
  
  <form class="formulario" action="#" method="post">
      <ul>
         <li>
              <h2>Contáctanos</h2>
         </li>
         <li>
             <label for="name" class="obligatorio">Nombre:</label>
             <input type="text" name="name" placeholder="Aga Pito" required autofocus />
         </li>
          <li>
             <label for="telef">Telefono:</label>
             <input type="tel"  name="telef" placeholder="96 111 11 11" pattern="\d{9}$"/>
         </li>
         <li>
             <label for="email" class="obligatorio">Email:</label>
             <input type="email" name="email" placeholder="agapito@ejemplo.com" required/>
         </li>
         <li>
             <label for="website">Sitio Web:</label>
             <input type="url" name="web" placeholder="http://ncoge.com" />
         </li>
          <li>
             <label for="edad">Edad:</label>
             <input type="number" name="edad" min="1" max="99" value="18" step="1" />
         </li>

         <li>
             <label for="Mensaje" class="obligatorio">Mensaje:</label>
             <textarea name="Mensaje" cols="40" rows="6"  ></textarea required>
         </li>
        <li>
          <button class="submit" type="submit">Enviar</button>
        </li>
      </ul>
  </form>

    <footer>
        Copyright La casa de la pradera, todos los derechos reservados. <a href="mailto:spameamepliss@gmail.com">spameamepliss@gmail.com</a>
    </footer>
</body>
</html>
